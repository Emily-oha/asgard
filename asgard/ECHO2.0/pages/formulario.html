<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECHO – Construtor de Formulários</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/formulario.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">
      <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="16" width="4" height="16" rx="2" fill="#6B21F5"/>
        <rect x="13" y="10" width="4" height="28" rx="2" fill="#6B21F5"/>
        <rect x="20" y="4"  width="4" height="40" rx="2" fill="#6B21F5"/>
        <rect x="27" y="10" width="4" height="28" rx="2" fill="#6B21F5"/>
        <rect x="34" y="16" width="4" height="16" rx="2" fill="#6B21F5"/>
      </svg>
    </div>
    <h1 class="header-title">Construtor de Formulários</h1>
    <div class="header-spacer"></div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- PERGUNTAS PRONTAS -->
    <div class="card">
      <h2 class="card-title">Perguntas Prontas</h2>

      <div class="question-list" id="presetList">
        <label class="question-item">
          <input type="checkbox" value="Você está satisfeito com o serviço?" data-type="radio" />
          <span>Você está satisfeito com o serviço?</span>
        </label>
        <label class="question-item">
          <input type="checkbox" value="O atendimento foi rápido?" data-type="radio" />
          <span>O atendimento foi rápido?</span>
        </label>
        <label class="question-item">
          <input type="checkbox" value="Você recomendaria a empresa para amigos?" data-type="text" />
          <span>Você recomendaria a empresa para amigos?</span>
        </label>
        <label class="question-item">
          <input type="checkbox" value="A comunicação da empresa é clara?" data-type="multiple" />
          <span>A comunicação da empresa é clara?</span>
        </label>
        <label class="question-item">
          <input type="checkbox" value="O produto/serviço atendeu suas expectativas?" data-type="rating" />
          <span>O produto/serviço atendeu suas expectativas?</span>
        </label>
        <label class="question-item">
          <input type="checkbox" value="Como avalia a qualidade do produto?" data-type="rating" />
          <span>Como avalia a qualidade do produto?</span>
        </label>
        <label class="question-item">
          <input type="checkbox" value="O preço é justo pelo serviço oferecido?" data-type="radio" />
          <span>O preço é justo pelo serviço oferecido?</span>
        </label>
      </div>

      <!-- Pergunta personalizada -->
      <div class="custom-row">
        <input type="text" id="customQuestion" class="custom-input" placeholder="Pergunta personalizada..." />
        <select id="customType" class="custom-select">
          <option value="text">Texto</option>
          <option value="radio">Sim/Não</option>
          <option value="multiple">Múltipla escolha</option>
          <option value="rating">Avaliação (estrelas)</option>
        </select>
        <button class="btn-add" id="btnAdd">Adicionar</button>
      </div>
    </div>

    <!-- FORMULÁRIO MONTADO -->
    <div class="card">
      <h2 class="card-title">Formulário</h2>

      <div class="form-actions">
        <button class="btn-save" id="btnSave">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Salvar Formulário
        </button>
        <button class="btn-preview" id="btnPreview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Visualizar
        </button>
      </div>

      <div class="form-name-row">
        <input type="text" id="formName" class="form-name-input" placeholder="Nome do formulário..." />
      </div>

      <div id="formQuestions" class="form-questions">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <p>Selecione perguntas ao lado ou adicione uma personalizada.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Início
    </a>
    <a href="#" class="nav-tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Formulários
    </a>
    <a href="feedback.html" class="nav-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Feedback
    </a>
    <a href="#" class="nav-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Perfil
    </a>
  </nav>

  <!-- MODAL PREVIEW -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Formulário para Cliente</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn-submit" id="btnSubmit">Enviar Respostas</button>
        <p class="modal-copy">© 2025 ECHO</p>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="../js/formulario.js"></script>
</body>
</html>
