<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <img src="../assets/logo.png" alt="ECHO" class="logo">

            <h1>ECHO</h1>

            <p class="subtitle">
                Faça login para continuar
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    placeholder="Seu e-mail"
                    required
                >

                <input
                    type="password"
                    placeholder="Sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div class="links">
                <a href="#">Esqueci minha senha</a>
                <a href="#">Criar conta</a>
            </div>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>

</html>
