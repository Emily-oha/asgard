<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECHO - Login</title>

<link rel="stylesheet" href="../css/login-v3.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- LADO ESQUERDO -->
    <div class="left-panel">

        <div class="logo-container">

            <img src="../assets/Logo.png"
                 alt="ECHO"
                 class="logo">

            <h2>ECHO</h2>

            <p class="slogan">
                Sua <span>voz</span>.<br>
                Nosso propósito.
            </p>

        </div>

        <div class="wave"></div>

        <div class="description">
            Transformando feedback em decisões inteligentes.
        </div>

    </div>

    <!-- LADO DIREITO -->
    <div class="right-panel">

        <div class="login-box">

            <img src="../assets/Logo.png"
                 class="mini-logo"
                 alt="Logo">

            <h1>
                Bem-vindo(a)
                <span>de volta!</span>
            </h1>

            <p>
                Faça login para acessar o ECHO.
            </p>

            <form>

                <div class="input-group">

                    <i class="fa-regular fa-user"></i>

                    <input
                    type="text"
                    placeholder="E-mail ou usuário">

                </div>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    id="senha"
                    type="password"
                    placeholder="Senha">

                    <i
                    class="fa-regular fa-eye eye"
                    onclick="togglePassword()">
                    </i>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Lembrar de mim

                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

        </div>

    </div>

</div>

<script src="../js/login-v3.js"></script>

</body>
</html>
