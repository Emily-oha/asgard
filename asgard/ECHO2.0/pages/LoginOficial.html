        <h1 class="card-title">Bem-vindo(a) <em>de volta!</em></h1>
        <p class="card-subtitle">Faça login para acessar o ECHO.</p>

        <!-- Mensagem de erro -->
        <div class="error-msg" id="error-msg"></div>

        <!-- E-mail -->
        <div class="field">
          <svg
            class="field-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <input
            type="text"
            id="email"
            placeholder="E-mail ou usuário"
            autocomplete="username"
          />
        </div>

        <!-- Senha -->
        <div class="field">
          <svg
            class="field-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            type="password"
            id="senha"
            placeholder="Senha"
            autocomplete="current-password"
          />
          <button
            class="toggle-pw"
            type="button"
            onclick="togglePw()"
            aria-label="Mostrar/ocultar senha"
          >
            <svg
              id="icon-eye-off"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
              />
              <path
                d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            <svg
              id="icon-eye"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="display: none"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <!-- Opções -->
        <div class="row-options">
          <label class="remember">
            <input type="checkbox" id="remember" /> Lembrar de mim
          </label>
          <a href="#" class="link">Esqueci minha senha</a>
        </div>

        <!-- Entrar -->
        <button class="btn-primary" type="button" onclick="handleLogin()">
          Entrar
        </button>

        <div class="divider">ou</div>

        <!-- Google -->
        <button class="btn-google" type="button" onclick="handleGoogleLogin()">
          <svg
            width="20"
            height="20"
            viewBox="0 0 48 48"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill="#EA4335"
              d="M24 9.5c3.15 0 5.64 1.08 7.55 2.84l5.63-5.63C33.72 3.52 29.2 1.5 24 1.5 14.98 1.5 7.3 7.1 4.02 14.96l6.57 5.1C12.26 13.48 17.62 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.5 24c0-1.64-.15-3.22-.43-4.75H24v9h12.7c-.55 2.9-2.2 5.36-4.68 7.02l7.18 5.58C43.46 36.8 46.5 30.88 46.5 24z"
            />
            <path
              fill="#FBBC05"
              d="M10.59 28.06A14.6 14.6 0 0 1 9.5 24c0-1.41.2-2.78.56-4.06l-6.57-5.1A22.46 22.46 0 0 0 1.5 24c0 3.64.87 7.08 2.4 10.12l6.69-6.06z"
            />
            <path
              fill="#34A853"
              d="M24 46.5c5.2 0 9.56-1.72 12.74-4.66l-7.18-5.58c-1.78 1.2-4.06 1.9-5.56 1.9-6.38 0-11.74-4-13.66-9.56l-6.69 6.06C7.3 40.9 14.98 46.5 24 46.5z"
            />
          </svg>
          Entrar com Google
        </button>

        <p class="footer-text">
          Ainda não tem uma conta?
          <a href="#" class="link">Fale com o administrador.</a>
        </p>
      </div>
    </main>

    <script src="../js/LoginOficial.js"></script>
  </body>
</html>
